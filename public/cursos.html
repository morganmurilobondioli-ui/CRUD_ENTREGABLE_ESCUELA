<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Cursos</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Gestión de Cursos</h1>

    <div class="card shadow p-4">
      <form id="cursoForm">
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="categoria" class="form-label">Categoría</label>
            <select id="categoria" class="form-select" required></select>
          </div>
          <div class="col-md-6">
            <label for="subcategoria" class="form-label">Subcategoría</label>
            <select id="subcategoria" class="form-select" required></select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="titulo" class="form-label">Título del curso</label>
            <input type="text" id="titulo" class="form-control" placeholder="Ej: Python Básico" required />
          </div>
          <div class="col-md-6">
            <label for="descripcion" class="form-label">Descripción</label>
            <input type="text" id="descripcion" class="form-control" placeholder="Breve descripción del curso" />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-3">
            <label for="fecha_inicio" class="form-label">Fecha inicio</label>
            <input type="date" id="fecha_inicio" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="fecha_fin" class="form-label">Fecha fin</label>
            <input type="date" id="fecha_fin" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="duracion_horas" class="form-label">Duración (horas)</label>
            <input type="number" id="duracion_horas" class="form-control" placeholder="Ej: 40" required />
          </div>
          <div class="col-md-3">
            <label for="precio" class="form-label">Precio (S/)</label>
            <input type="number" id="precio" class="form-control" step="0.01" placeholder="Ej: 210.00" required />
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label for="docente" class="form-label">Docente</label>
            <select id="docente" class="form-select" required></select>
          </div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4">Registrar Curso</button>
        </div>
      </form>
    </div>

    <div class="card mt-5 shadow">
      <div class="card-body">
        <h4 class="mb-3">Lista de cursos registrados</h4>
        <table class="table table-striped" id="tablaCursos">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Categoría</th>
              <th>Subcategoría</th>
              <th>Docente</th>
              <th>Precio (S/)</th>
              <th>Duración (h)</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

</script>
</body>
</html>
