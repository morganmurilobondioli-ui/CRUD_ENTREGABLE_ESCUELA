<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Cursos</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Gestión de Cursos</h1>

    <div class="card shadow p-4">
      <form id="cursoForm">
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="categoria" class="form-label">Categoría</label>
            <select id="categoria" class="form-select" required></select>
          </div>
          <div class="col-md-6">
            <label for="subcategoria" class="form-label">Subcategoría</label>
            <select id="subcategoria" class="form-select" required></select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="titulo" class="form-label">Título del curso</label>
            <input type="text" id="titulo" class="form-control" placeholder="Ej: Python Básico" required />
          </div>
          <div class="col-md-6">
            <label for="descripcion" class="form-label">Descripción</label>
            <input type="text" id="descripcion" class="form-control" placeholder="Breve descripción del curso" />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-3">
            <label for="fecha_inicio" class="form-label">Fecha inicio</label>
            <input type="date" id="fecha_inicio" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="fecha_fin" class="form-label">Fecha fin</label>
            <input type="date" id="fecha_fin" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="duracion_horas" class="form-label">Duración (horas)</label>
            <input type="number" id="duracion_horas" class="form-control" placeholder="Ej: 40" required />
          </div>
          <div class="col-md-3">
            <label for="precio" class="form-label">Precio (S/)</label>
            <input type="number" id="precio" class="form-control" step="0.01" placeholder="Ej: 210.00" required />
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label for="docente" class="form-label">Docente</label>
            <select id="docente" class="form-select" required></select>
          </div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4">Registrar Curso</button>
        </div>
      </form>
    </div>

    <div class="card mt-5 shadow">
      <div class="card-body">
        <h4 class="mb-3">Lista de cursos registrados</h4>
        <table class="table table-striped" id="tablaCursos">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Categoría</th>
              <th>Subcategoría</th>
              <th>Docente</th>
              <th>Precio (S/)</th>
              <th>Duración (h)</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const categoriaSelect = document.getElementById("categoria");
    const subcategoriaSelect = document.getElementById("subcategoria");
    const docenteSelect = document.getElementById("docente");
    const tablaBody = document.querySelector("#tablaCursos tbody");
    const form = document.getElementById("cursoForm");
    const submitBtn = document.querySelector("#cursoForm button[type='submit']");

    let categorias = [];
    let subcategorias = [];
    let docentes = [];      
    let cursos = [];

    function actualizarSubcategorias(idCat) {
        subcategoriaSelect.innerHTML = '<option value="">Seleccione...</option>';
        subcategorias
        .filter(s => String(s.id_categoria) === String(idCat))
        .forEach(s => {
              subcategoriaSelect.innerHTML += `<option value="${s.id_subcategoria}">${s.nombre}</option>`;
        });
    }

      try {
        const [categoriasRes, subcategoriasRes, docentesRes, cursosRes] = await Promise.all([
          fetch("/cursos/data/categorias"),
          fetch("/cursos/data/subcategorias"),
          fetch("/cursos/data/docentes"),
          fetch("/cursos")
        ]);

        categorias = await categoriasRes.json();
        subcategorias = await subcategoriasRes.json();
        docentes = await docentesRes.json();
        cursos = await cursosRes.json();

        categoriaSelect.innerHTML = '<option value="">Seleccione...</option>';

        categorias.forEach(cat => {
          categoriaSelect.innerHTML += `<option value="${cat.id_categoria}">${cat.nombre}</option>`;
        });

        subcategoriaSelect.innerHTML = '<option value="">Seleccione...</option>';
        subcategorias.forEach(s => {
          subcategoriaSelect.innerHTML += `<option value="${s.id_subcategoria}" data-cat="${s.id_categoria}">${s.nombre}</option>`;
        });

        docenteSelect.innerHTML = '<option value="">Seleccione...</option>';
        docentes.forEach(d => {
          docenteSelect.innerHTML += `<option value="${d.id_docente}">${d.nombre} ${d.apellido || ""}</option>`;
        });

        categoriaSelect.addEventListener("change", (e) => {
          actualizarSubcategorias(e.target.value);
        });

        function renderCursos() {
          tablaBody.innerHTML = cursos.map(c => `
              <tr>
              <td>${c.id_curso}</td>
              <td>${c.titulo}</td>
              <td>${c.nombre_categoria || '-'}</td>
              <td>${c.nombre_subcategoria || '-'}</td>
              <td>${c.nombre_docente ? `${c.nombre_docente} ${c.apellido_docente || ''}` : '-'}</td>
              <td>${c.precio}</td>
              <td>${c.duracion_horas}</td>
              <td>
                  <button class="btn btn-warning btn-sm me-2" onclick="editarCurso(${c.id_curso})">✏️ Editar</button>
                  <button class="btn btn-danger btn-sm" onclick="eliminarCurso(${c.id_curso})">🗑️ Eliminar</button>
              </td>
              </tr>
          `).join("");
        }

        renderCursos();

      } catch (error) {
          console.error("Error cargando datos:", error);
          Swal.fire("Error", "No se pudieron cargar los datos iniciales", "error");
          return;
      }

      // --- SUBMIT (crear / actualizar) ---
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
          titulo: document.getElementById("titulo").value,
          descripcion: document.getElementById("descripcion").value,
          fecha_inicio: document.getElementById("fecha_inicio").value || null,
          fecha_fin: document.getElementById("fecha_fin").value || null,
          duracion_horas: document.getElementById("duracion_horas").value || null,
          precio: document.getElementById("precio").value || null,
          id_docente: document.getElementById("docente").value || null,
          id_subcategoria: document.getElementById("subcategoria").value || null
        };

        const editingId = form.dataset.editingId;
        const url = editingId ? `/cursos/${editingId}` : "/cursos";
        const method = editingId ? "PUT" : "POST";

        try {
          const res = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Error en la solicitud");

        await res.json();
        await Swal.fire({
            icon: "success",
            title: editingId ? "Curso actualizado" : "Curso registrado",
            text: editingId ? "Los cambios fueron guardados correctamente" : "El curso se registró con éxito",
            timer: 1800,
            showConfirmButton: false
        });

        location.reload();

        } catch (error) {
          console.error("Error:", error);
          Swal.fire("Error", "No se pudo guardar el curso", "error");
        }
      });

      // --- Eliminar curso ---
      window.eliminarCurso = async function(id) {
        const result = await Swal.fire({
        title: "¿Eliminar curso?",
        text: "Esta acción no se puede deshacer",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar"
      });

      if (!result.isConfirmed) return;
        try {
          const res = await fetch(`/cursos/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("No se pudo eliminar");
          Swal.fire({
              icon: "success",
              title: "Eliminado",
              text: "El curso fue eliminado correctamente",
              timer: 1500,
              showConfirmButton: false
        });

          setTimeout(() => location.reload(), 1500);
        } catch (error) {
          console.error(error);
          Swal.fire("Error", "No se pudo eliminar el curso", "error");
        }
      };

      // --- Editar curso ---
      window.editarCurso = async function(id) {
        try {
          const res = await fetch(`/cursos/${id}`);
          if (!res.ok) throw new Error("No se pudo obtener el curso");
          const curso = await res.json();

          document.getElementById("titulo").value = curso.titulo || "";
          document.getElementById("descripcion").value = curso.descripcion || "";
          document.getElementById("fecha_inicio").value = curso.fecha_inicio?.split("T")[0] || "";
          document.getElementById("fecha_fin").value = curso.fecha_fin?.split("T")[0] || "";
          document.getElementById("duracion_horas").value = curso.duracion_horas || "";
          document.getElementById("precio").value = curso.precio || "";

          const subcatObj = subcategorias.find(s => String(s.id_subcategoria) === String(curso.id_subcategoria));
          const catId = subcatObj ? subcatObj.id_categoria : null;

          if (catId) {
            categoriaSelect.value = String(catId);
            actualizarSubcategorias(catId);
          }
          if (curso.id_subcategoria) subcategoriaSelect.value = String(curso.id_subcategoria);
          if (curso.id_docente) docenteSelect.value = String(curso.id_docente);

          submitBtn.textContent = "Actualizar Curso";
          submitBtn.classList.remove("btn-primary");
          submitBtn.classList.add("btn-success");
          form.dataset.editingId = id;

          Swal.fire({
            icon: "info",
            title: "Editando curso",
            text: `Ahora puedes modificar la información del curso "${curso.titulo}"`,
            timer: 1800,
            showConfirmButton: false
          });

          window.scrollTo({ top: 0, behavior: "smooth" });
          } catch (error) {
          console.error(error);
          Swal.fire("Error", "No se pudieron cargar los datos del curso", "error");
        }
      };
  });
</script>
</body>
</html>
